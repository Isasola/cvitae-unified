name: Matching retrieval coverage

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      max_users:
        description: Profiles processed per run (bounded)
        required: false
        default: '2'
      page_size:
        description: Opportunities per page (maximum 500)
        required: false
        default: '250'
      max_pages:
        description: Pages per profile per run (bounded)
        required: false
        default: '4'

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/run_matching_retrieval_expansion.ts --max-users "${{ inputs.max_users || '2' }}" --page-size "${{ inputs.page_size || '250' }}" --max-pages "${{ inputs.max_pages || '4' }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
