name: CVitae Scrapers

on:
  schedule:
    # 06:00 hora Paraguay (UTC-4) todos los días
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      scraper:
        description: 'all | computrabajo | buscojobs | oya | opportunitydesk | remotive | unjobs | becal | carolina | abc | fundacion | multi | arbeitnow | himalayas | jobicy | weworkremotely | sicca | ministerios | bancos | cooperativas | callcenters | seguros | universidades | constructoras | vierci | cartes | hospitales | foros | supermercados | ongs | tech_local'
        required: false
        default: 'all'

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # ── Paraguay — bolsas de empleo principales ──────────────────────────

      - name: Computrabajo Paraguay (~650 ofertas)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'computrabajo' || github.event_name == 'schedule' }}
        run: python scrapers/computrabajo_scraper.py
        continue-on-error: true

      - name: BuscoJobs Paraguay (~320 ofertas, 16 categorías)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'buscojobs' || github.event_name == 'schedule' }}
        run: python scrapers/buscojobs_scraper.py
        continue-on-error: true

      - name: Multi-site PY — clasipar, mtess, tigo, personal, itau, copaco
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'multi' || github.event_name == 'schedule' }}
        run: python scrapers/scrapper.py
        continue-on-error: true

      - name: ABC Color Empleos (Playwright)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'abc' || github.event_name == 'schedule' }}
        run: python scrapers/abc_scrapper.py
        continue-on-error: true

      - name: Fundación Paraguaya Portal Empleo (Playwright)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'fundacion' || github.event_name == 'schedule' }}
        run: python scrapers/fundacion_scraper.py
        continue-on-error: true

      # ── Internacional — empleos remotos para latinos ─────────────────────

      - name: Remotive — empleos remotos (~88)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'remotive' || github.event_name == 'schedule' }}
        run: python scrapers/remotive_scraper.py
        continue-on-error: true

      # ── Becas, fellowships, capital semilla ──────────────────────────────

      - name: OYA Opportunities (~96 oportunidades internacionales)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'oya' || github.event_name == 'schedule' }}
        run: python scrapers/oya_scraper.py
        continue-on-error: true

      - name: OpportunityDesk — becas, cursos, grants (~300)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'opportunitydesk' || github.event_name == 'schedule' }}
        run: python scrapers/opportunitydesk_scraper.py
        continue-on-error: true

      - name: BECAL — becas gobierno paraguayo
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'becal' || github.event_name == 'schedule' }}
        run: python scrapers/becal_scraper.py
        continue-on-error: true

      - name: Fundación Carolina — becas posgrado en España
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'carolina' || github.event_name == 'schedule' }}
        run: python scrapers/fundacion_carolina_scraper.py
        continue-on-error: true

      # ── Internacional — remotos globales ─────────────────────────────────

      - name: Arbeitnow — tech/remote global (hasta 1000)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'arbeitnow' || github.event_name == 'schedule' }}
        run: python scrapers/arbeitnow_scraper.py
        continue-on-error: true

      - name: Himalayas — 86k empleos remote-first (hasta 2000)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'himalayas' || github.event_name == 'schedule' }}
        run: python scrapers/himalayas_scraper.py
        continue-on-error: true

      - name: Jobicy — remotos por industria (50×12 = 600)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'jobicy' || github.event_name == 'schedule' }}
        run: python scrapers/jobicy_scraper.py
        continue-on-error: true

      - name: WeWorkRemotely — RSS 14 categorías (~400)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'weworkremotely' || github.event_name == 'schedule' }}
        run: python scrapers/weworkremotely_scraper.py
        continue-on-error: true

      # ── Organismos internacionales ────────────────────────────────────────

      - name: UNJobs — ONU, UNDP, UNICEF, BID (PY + LatAm)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'unjobs' || github.event_name == 'schedule' }}
        run: python scrapers/unjobs_scraper.py
        continue-on-error: true

      # ── Paraguay — sector público y gobierno ─────────────────────────────

      - name: SICCA / SFP — Concursos sector público
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'sicca' || github.event_name == 'schedule' }}
        run: python scrapers/sicca_scraper.py
        continue-on-error: true

      - name: Ministerios del Paraguay
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'ministerios' || github.event_name == 'schedule' }}
        run: python scrapers/ministerios_scraper.py
        continue-on-error: true

      # ── Paraguay — sector financiero ──────────────────────────────────────

      - name: Bancos paraguayos (BNF, Continental, Sudameris, GNB, etc.)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'bancos' || github.event_name == 'schedule' }}
        run: python scrapers/bancos_scraper.py
        continue-on-error: true

      - name: Cooperativas paraguayas (Universitaria, Medalla Milagrosa, etc.)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'cooperativas' || github.event_name == 'schedule' }}
        run: python scrapers/cooperativas_scraper.py
        continue-on-error: true

      - name: Aseguradoras paraguayas
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'seguros' || github.event_name == 'schedule' }}
        run: python scrapers/seguros_scraper.py
        continue-on-error: true

      # ── Paraguay — servicios y BPO ────────────────────────────────────────

      - name: Call Centers — Atento, Teleperformance, Konecta, etc.
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'callcenters' || github.event_name == 'schedule' }}
        run: python scrapers/callcenters_scraper.py
        continue-on-error: true

      # ── Paraguay — educación ──────────────────────────────────────────────

      - name: Universidades paraguayas (UNA, UCN, UAP, etc.)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'universidades' || github.event_name == 'schedule' }}
        run: python scrapers/universidades_scraper.py
        continue-on-error: true

      # ── Paraguay — construcción e ingeniería ─────────────────────────────

      - name: Constructoras paraguayas (Itaipú, Yacyretá, MOPC, etc.)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'constructoras' || github.event_name == 'schedule' }}
        run: python scrapers/constructoras_scraper.py
        continue-on-error: true

      # ── Paraguay — grandes grupos empresariales ───────────────────────────

      - name: Grupo Vierci (La Nación, GEN, MegaSuper)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'vierci' || github.event_name == 'schedule' }}
        run: python scrapers/grupovierci_scraper.py
        continue-on-error: true

      - name: Grupo Cartes (Tabacalera, Frigomerc, RPC, Canal 9)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'cartes' || github.event_name == 'schedule' }}
        run: python scrapers/grupocarteshs_scraper.py
        continue-on-error: true

      # ── Paraguay — salud ──────────────────────────────────────────────────

      - name: Hospitales y clínicas paraguayas
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'hospitales' || github.event_name == 'schedule' }}
        run: python scrapers/hospitales_scraper.py
        continue-on-error: true

      # ── Paraguay — retail y comercio ──────────────────────────────────────

      - name: Supermercados y retail paraguayo
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'supermercados' || github.event_name == 'schedule' }}
        run: python scrapers/supermercados_scraper.py
        continue-on-error: true

      # ── Paraguay — ONGs y cooperación internacional ───────────────────────

      - name: ONGs, fundaciones y organismos de cooperación
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'ongs' || github.event_name == 'schedule' }}
        run: python scrapers/ongs_scraper.py
        continue-on-error: true

      # ── Paraguay — tecnología local ───────────────────────────────────────

      - name: Empresas tech locales (SODEP, LSD, Roshka, etc.)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'tech_local' || github.event_name == 'schedule' }}
        run: python scrapers/tech_local_scraper.py
        continue-on-error: true

      # ── Foros y comunidades ───────────────────────────────────────────────

      - name: Foros — Reddit r/Paraguay + comunidades PY
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'foros' || github.event_name == 'schedule' }}
        run: python scrapers/foros_scraper.py
        continue-on-error: true
