name: CVitae Scrapers

on:
  schedule:
    # 07:00 hora Paraguay (UTC-3) todos los días; GitHub puede demorar el inicio
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      scraper:
        description: 'all | computrabajo | buscojobs | oya | opportunitydesk | remotive | unjobs | becal | carolina | abc | fundacion | multi | arbeitnow | himalayas | jobicy | weworkremotely | sicca | ministerios | bancos | cooperativas | callcenters | seguros | universidades | constructoras | vierci | cartes | hospitales | foros | supermercados | ongs | tech_local | jooble | talentcom | googlejobs | automotriz | farmacias | gastronomia | agroindustria | frigorificos | industria | telecomunicaciones | medios | retail_malls | logistica | energia | puertos | cde_frontera | workday | bolsas_locales'
        required: false
        default: 'all'

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # ── Limpieza previa — elimina oportunidades con más de 7 días ────────

      - name: Cleanup — eliminar oportunidades vencidas (+7 días)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.scraper == 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'EOF'
          import os, requests
          url = os.environ["SUPABASE_URL"] + "/rest/v1/rpc/cleanup_old_opportunities"
          headers = {
              "apikey": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              "Authorization": "Bearer " + os.environ["SUPABASE_SERVICE_ROLE_KEY"],
              "Content-Type": "application/json",
          }
          r = requests.post(url, headers=headers, json={})
          print(f"Cleanup status: {r.status_code} — eliminadas: {r.text}")
          EOF
        continue-on-error: true

      # ── Paraguay — bolsas de empleo principales ──────────────────────────

      - name: Computrabajo Paraguay (~650 ofertas)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'computrabajo' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py computrabajo_scraper computrabajo_scraper scrapers/computrabajo_scraper.py
        continue-on-error: true

      - name: BuscoJobs Paraguay (~320 ofertas, 16 categorías)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'buscojobs' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py buscojobs_scraper buscojobs_scraper scrapers/buscojobs_scraper.py
        continue-on-error: true

      - name: Multi-site PY — clasipar, mtess, tigo, personal, itau, copaco
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'multi' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py scrapper scrapper scrapers/scrapper.py
        continue-on-error: true

      - name: ABC Color Empleos (Playwright)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'abc' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py abc_scrapper abc_scrapper scrapers/abc_scrapper.py
        continue-on-error: true

      - name: Fundación Paraguaya Portal Empleo (Playwright)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'fundacion' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py fundacion_scraper fundacion_scraper scrapers/fundacion_scraper.py
        continue-on-error: true

      # ── Internacional — empleos remotos para latinos ─────────────────────

      - name: Remotive — empleos remotos (~88)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'remotive' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py remotive_scraper remotive_scraper scrapers/remotive_scraper.py
        continue-on-error: true

      # ── Becas, fellowships, capital semilla ──────────────────────────────

      - name: OYA Opportunities (~96 oportunidades internacionales)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'oya' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py oya_scraper oya_scraper scrapers/oya_scraper.py
        continue-on-error: true

      - name: OpportunityDesk — becas, cursos, grants (~300)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'opportunitydesk' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py opportunitydesk_scraper opportunitydesk_scraper scrapers/opportunitydesk_scraper.py
        continue-on-error: true

      - name: BECAL — becas gobierno paraguayo
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'becal' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py becal_scraper becal_scraper scrapers/becal_scraper.py
        continue-on-error: true

      - name: Fundación Carolina — becas posgrado en España
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'carolina' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py fundacion_carolina_scraper fundacion_carolina_scraper scrapers/fundacion_carolina_scraper.py
        continue-on-error: true

      # ── Internacional — remotos globales ─────────────────────────────────

      - name: Arbeitnow — tech/remote global (hasta 1000)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'arbeitnow' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py arbeitnow_scraper arbeitnow_scraper scrapers/arbeitnow_scraper.py
        continue-on-error: true

      - name: Himalayas — 86k empleos remote-first (hasta 2000)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'himalayas' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py himalayas_scraper himalayas_scraper scrapers/himalayas_scraper.py
        continue-on-error: true

      - name: Jobicy — remotos por industria (50×12 = 600)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'jobicy' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py jobicy_scraper jobicy_scraper scrapers/jobicy_scraper.py
        continue-on-error: true

      - name: WeWorkRemotely — RSS 14 categorías (~400)
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'weworkremotely' || github.event_name == 'schedule' }}
        run: python scripts/run_scraper_monitored.py weworkremotely_scraper weworkremotely_scraper scrapers/weworkremotely_scraper.py
        continue-on-error: true

      # ── Organismos internacionales ────────────────────────────────────────

      - name: UNJobs — ONU, UNDP, UNICEF, BID (PY + LatAm)
