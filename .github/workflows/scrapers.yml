      # ── Agregadores y sector humanitario global ───────────────────────────

      - name: Jooble — agregador global con foco en Paraguay/LatAm
        if: ${{ github.event.inputs.scraper == 'all' || github.event.inputs.scraper == 'jooble' || github.event_name == 'schedule' }}
