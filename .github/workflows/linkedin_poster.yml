name: CVitae LinkedIn Auto-Poster

on:
  schedule:
    # Cada hora entre 09:00-23:00 hora Paraguay (UTC-3 = 12:00-02:00 UTC)
    - cron: '0 12-23,0,1,2 * * *'
  workflow_dispatch:

jobs:
  post-to-linkedin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post opportunities to LinkedIn
        run: python scrapers/linkedin_poster.py
        continue-on-error: true
