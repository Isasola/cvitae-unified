name: CVitae Blog Generator

on:
  schedule:
    # Every Sunday at 08:00 PY time (UTC-3 = 11:00 UTC)
    - cron: '0 11 * * 0'
  workflow_dispatch:

jobs:
  generate-blog:
    if: vars.CVITAE_BLOG_DRAFTS_ENABLED == 'true' && vars.CVITAE_BLOG_DRAFTS_CERTIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cvitae-blog-drafts
      cancel-in-progress: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.CVITAE_BLOG_MODEL || 'gemini-3.8-flash' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.CVITAE_BLOG_FALLBACK_MODEL || 'gemini-3.6-flash' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate pending drafts from canonical Catalog and SEO views
        run: python scripts/generate_blog_posts.py
