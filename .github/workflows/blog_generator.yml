name: CVitae Blog Generator

on:
  schedule:
    # Every Sunday at 08:00 PY time (UTC-3 = 11:00 UTC)
    - cron: '0 11 * * 0'
  workflow_dispatch:

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate blog drafts from SS opportunities
        run: python scripts/generate_blog_posts.py
