name: CVitae - Opportunity Universe maintenance

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      confirm_prod_recovery:
        description: 'Confirm an authorized bounded Universe recovery canary'
        type: choice
        options: ['NO', 'YES']
        default: 'NO'
        required: true
      canary_only:
        description: 'Process one persisted dirty-source page, without the due lifecycle queue'
        type: choice
        options: ['YES', 'NO']
        default: 'YES'
        required: true

permissions:
  contents: read

concurrency:
  group: cvitae-opportunity-universe-maintenance
  cancel-in-progress: false

jobs:
  reconcile:
    if: (github.event_name == 'schedule' && vars.CVITAE_RECOVERY_CRON_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirm_prod_recovery == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch' && inputs.canary_only == 'YES'
        run: pnpm exec tsx scripts/reconcile_119_canary.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.canary_only == 'NO')
        run: pnpm exec tsx scripts/refresh_opportunity_universe_maintenance.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
