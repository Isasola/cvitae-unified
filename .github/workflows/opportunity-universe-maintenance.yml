name: CVitae - Opportunity Universe maintenance

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      confirm_prod_recovery:
        description: 'Confirm an authorized bounded Universe recovery canary'
        type: choice
        options: ['NO', 'YES']
        default: 'NO'
        required: true
      canary_only:
        description: 'Process one persisted dirty-source page, without the due lifecycle queue'
        type: choice
        options: ['YES', 'NO']
        default: 'YES'
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cvitae-opportunity-universe-maintenance
  cancel-in-progress: false

jobs:
  healthcheck:
    if: (github.event_name == 'schedule' && vars.CVITAE_RECOVERY_CRON_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirm_prod_recovery == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Ping Supabase
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 8 "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}")
          echo "Supabase HTTP: $HTTP"
          [ "$HTTP" = "200" ] || exit 1

  reconcile:
    needs: healthcheck
    if: (github.event_name == 'schedule' && vars.CVITAE_RECOVERY_CRON_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.confirm_prod_recovery == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find previous completed maintenance checkpoint
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace(/^refs\/heads\//, '');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'opportunity-universe-maintenance.yml',
              branch,
              status: 'completed',
              per_page: 10,
            });
            const previous = runs.data.workflow_runs.find(run => run.id < context.runId);
            if (!previous) return;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: previous.id,
            });
            const state = artifacts.data.artifacts.find(item => item.name === 'universe-maintenance-progress' && !item.expired);
            if (state) core.setOutput('run_id', String(previous.id));
      - name: Download previous maintenance progress window
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: universe-maintenance-progress
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/universe-previous
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch' && inputs.canary_only == 'YES'
        run: pnpm exec tsx scripts/reconcile_119_canary.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.canary_only == 'NO')
        run: pnpm exec tsx scripts/refresh_opportunity_universe_maintenance.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UNIVERSE_PREVIOUS_STATE_PATH: ${{ runner.temp }}/universe-previous
          UNIVERSE_MAINTENANCE_STATE_PATH: ${{ runner.temp }}/universe-maintenance-progress.json
      - name: Save bounded maintenance progress checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-maintenance-progress
          path: ${{ runner.temp }}/universe-maintenance-progress.json
          if-no-files-found: ignore
          retention-days: 14
