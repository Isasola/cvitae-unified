name: CVitae - Fabrica incremental de oportunidades

on:
  schedule:
    # Red de seguridad: solo procesa cambios pendientes, nunca hace backfill completo.
    - cron: '30 15 * * *'
  workflow_run:
    workflows: ['CVitae Scrapers']
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximo de oportunidades pendientes (1-50)'
        required: false
        default: '50'

permissions:
  contents: read

concurrency:
  group: cvitae-opportunity-factory
  cancel-in-progress: false

jobs:
  seal-and-embed:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FACTORY_LIMIT: ${{ github.event.inputs.limit || '50' }}
      HF_HOME: ~/.cache/huggingface
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-opportunity-factory.txt

      - name: Consultar cola pendiente
        id: queue
        run: python scripts/check_opportunity_factory_queue.py

      - name: Restaurar modelo local
        if: steps.queue.outputs.pending == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: cvitae-gte-small-${{ runner.os }}-${{ hashFiles('scripts/requirements-opportunity-factory.txt') }}
          restore-keys: |
            cvitae-gte-small-${{ runner.os }}-

      - name: Instalar fabrica local
        if: steps.queue.outputs.pending == 'true'
        run: pip install --requirement scripts/requirements-opportunity-factory.txt

      - name: Validar limite
        if: steps.queue.outputs.pending == 'true'
        shell: bash
        run: |
          if ! [[ "$FACTORY_LIMIT" =~ ^[0-9]+$ ]] || (( FACTORY_LIMIT < 1 || FACTORY_LIMIT > 50 )); then
            echo "::error::limit debe estar entre 1 y 50"
            exit 1
          fi

      - name: Sellar y generar embeddings locales pendientes
        if: steps.queue.outputs.pending == 'true'
        run: python scripts/opportunity_factory.py --limit "$FACTORY_LIMIT"

      - name: Cola al dia
        if: steps.queue.outputs.pending != 'true'
        run: echo "No hay oportunidades nuevas o modificadas; no se carga el modelo."
