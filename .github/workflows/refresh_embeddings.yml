name: CVitae — Actualizar embeddings

on:
  schedule:
    # Red de seguridad diaria; la ejecución principal ocurre al terminar scrapers.
    - cron: '30 15 * * *'
  workflow_run:
    workflows: ['CVitae Scrapers']
    types: [completed]
  workflow_dispatch:
    inputs:
      max_batches:
        description: 'Cantidad maxima de lotes de 5 (50 normal; hasta 250 para backfill controlado)'
        required: false
        default: '50'

jobs:
  refresh-opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cvitae-opportunity-embeddings
      cancel-in-progress: false
    steps:
      - name: Generar embeddings pendientes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_BATCHES: ${{ github.event.inputs.max_batches || '50' }}
        run: |
          if ! [[ "$MAX_BATCHES" =~ ^[0-9]+$ ]] || (( MAX_BATCHES < 1 || MAX_BATCHES > 250 )); then
            echo "::error::max_batches debe estar entre 1 y 250."
            exit 1
          fi
          total_processed=0
          for ((batch=1; batch<=MAX_BATCHES; batch++)); do
            raw=$(curl --silent --show-error \
              --request POST "$SUPABASE_URL/functions/v1/embed-opportunities" \
              --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --header "Content-Type: application/json" \
              --write-out $'\n%{http_code}' \
              --data '{"limit":5}')
            status="${raw##*$'\n'}"
            response="${raw%$'\n'*}"
            echo "Batch $batch (HTTP $status): $response"
            if [[ "$status" == "200" && "$response" =~ \"processed\":([0-9]+) ]]; then
              total_processed=$((total_processed + BASH_REMATCH[1]))
            fi
            if [[ "$status" == "200" && "$response" == *'"done":true'* ]]; then
              echo "Cola completada. Embeddings generados: $total_processed"
              break
            fi
            if [[ "$status" == "546" ]]; then
              echo "::warning::Supabase alcanzó el límite del worker; el próximo ciclo continuará desde este punto."
              break
            fi
            if [[ "$status" != "200" ]]; then
              echo "::error::La actualización de embeddings respondió HTTP $status."
              exit 1
            fi
          done
          echo "Embeddings generados en esta ejecucion: $total_processed"
