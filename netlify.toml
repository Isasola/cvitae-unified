[build]
  command = "pnpm build && node scripts/prerender.mjs && node scripts/generate-sitemap.mjs && node scripts/generate-robots.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]

# Funciones con riesgo de timeout (análisis con Bedrock)
[functions."analyze-cv-candidate"]
  timeout = 30

[functions."generate-cv-vivo"]
  timeout = 30

[functions."compare-candidates"]
  timeout = 30

[functions."analyze-vacancy-applicants"]
  timeout = 30

[functions."send-high-match-alerts"]
  timeout = 30

[functions."analyze-recruiters-batch"]
  timeout = 26

[functions."cv-ats-workspace"]
  timeout = 30

[functions."application-workspace"]
  timeout = 30

[functions."cv-rewrite-workspace"]
  timeout = 30

[[redirects]]
  from = "/ads.txt"
  to = "/ads.txt"
  status = 200
  force = true

[[redirects]]
  from = "/auth/callback"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
