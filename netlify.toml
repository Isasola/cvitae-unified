[build]
  command = "pnpm build && node scripts/prerender.mjs && node scripts/generate-sitemap.mjs && node scripts/generate-robots.mjs"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "bash netlify-should-build.sh"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pdfjs-dist"]

# Funciones con riesgo de timeout (análisis con Bedrock)
[functions."analyze-cv-candidate"]
  timeout = 30

[functions."generate-cv-vivo"]
  timeout = 30

[functions."compare-candidates"]
  timeout = 30

[functions."analyze-vacancy-applicants"]
  timeout = 30

[functions."send-high-match-alerts"]
  timeout = 30

[functions."analyze-recruiters-batch"]
  timeout = 26

[functions."admin-analytics"]
  timeout = 30

[functions."admin-data"]
  included_files = ["scrapers/source_registry.json", ".github/workflows/scrapers.yml"]

[functions."cv-ats-workspace"]
  timeout = 30

[functions."application-workspace"]
  timeout = 30

[functions."cv-rewrite-workspace"]
  timeout = 30

[[redirects]]
  from = "/ads.txt"
  to = "/ads.txt"
  status = 200
  force = true

[[redirects]]
  from = "/auth/callback"
  to = "/index.html"
  status = 200

# Dynamic sitemap — always serve fresh from Netlify function (force overrides static dist/sitemap.xml)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-:segment.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Dynamic routes: if no prerendered file exists, return real 404 (not Soft 404)
# When a prerendered file exists in dist/, Netlify serves it directly (these rules never fire)
[[redirects]]
  from = "/oportunidades/:slug"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/empleos/:slug"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/blog/:slug"
  to = "/404.html"
  status = 404

# SPA fallback for all other app routes (auth, hub, admin, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://analytics.google.com https://www.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
